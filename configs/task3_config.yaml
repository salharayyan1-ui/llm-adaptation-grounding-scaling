# Task 3 Configuration: Test-Time Compute
seed: 6304

data:
  data_dir: "./data/ATML-PA3-Data"
  llm_folder: "Qwen2.5-3B-Instruct"
  vlm_folder: "Qwen2.5-VL-3B-Instruct"
  total_questions: 1000
  dev_questions: 200
  test_questions: 800
  live_eval_questions: 50

offline_evaluation:
  candidate_budgets: [1, 2, 4, 8, 16, 32]
  num_permutations: 10
  bootstrap_resamples: 1000
  percentile_low: 0.05
  percentile_high: 0.95

adaptive_stopping:
  checkpoints: [4, 8, 16]
  max_rollouts: 32
  tau_grid: [0.5, 0.625, 0.75, 0.875, 1.0]
  gamma_grid: [0.0, 0.1, 0.25, 0.5]
  dev_tolerance_pct: 1.0

live_generation:
  model_name_or_path: "Qwen/Qwen2.5-3B-Instruct"
  fp16: true
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  repetition_penalty: 1.0
  total_token_allowance: 3072
  strategies:
    single_longer:
      max_tokens: 3072
    parallel:
      num_samples: 3
      max_tokens_per_sample: 1024
    refinement:
      initial_tokens: 1024
      revision_tokens: 2048

output_dir: "./outputs/task3"
